<!DOCTYPE html>

<html lang="vi">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis</title>

    <style>
        body {

            font-family: Arial, sans-serif;

            margin: 50px;

            background-color: #f4f7f6;

        }



        .container {

            max-width: 600px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 8px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

        }



        textarea {

            width: 100%;

            height: 100px;

            padding: 10px;

            font-size: 14px;

            border: 1px solid #ccc;

            border-radius: 4px;

            box-sizing: border-box;

            resize: vertical;

        }



        button {

            margin-top: 10px;

            padding: 10px 20px;

            font-size: 14px;

            cursor: pointer;

            background-color: #007BFF;

            color: white;

            border: none;

            border-radius: 4px;

        }



        button:hover {

            background-color: #0056b3;

        }



        #result {

            margin-top: 20px;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 4px;

            background: #f9f9f9;

        }
    </style>

</head>



<body>

    <div class="container">

        <h2>Phân tích cảm xúc văn bản</h2>

        <form id="sentiment-form">

            <textarea id="text-input" placeholder="Nhập nội dung cần phân tích..."></textarea><br>

            <button type="submit">Analyze</button>

        </form>



        <h3>Kết quả:</h3>

        <div id="result">Chưa có kết quả.</div>

    </div>



    <script>

        document.getElementById('sentiment-form').addEventListener('submit', async function (e) {

            e.preventDefault();

            const text = document.getElementById('text-input').value;

            const resultDiv = document.getElementById('result');



            if (!text.trim()) {

                resultDiv.innerHTML = '<span style="color: red;">Vui lòng nhập nội dung!</span>';

                return;

            }



            resultDiv.innerHTML = 'Đang phân tích...';



            try {

                const response = await fetch('/analyze', {

                    method: 'POST',

                    headers: { 'Content-Type': 'application/json' },

                    body: JSON.stringify({ text: text })

                });



                if (!response.ok) {

                    const errData = await response.json();

                    throw new Error(errData.detail || 'Lỗi hệ thống');

                }



                const data = await response.json();

                resultDiv.innerHTML = `

                    <strong>Cảm xúc:</strong> ${data.sentiment}<br>

                    <strong>Độ tin cậy:</strong> ${data.confidence}<br>

                    <strong>Model:</strong> ${data.model}

                `;

            } catch (error) {

                resultDiv.innerHTML = `<span style="color: red;">Lỗi: ${error.message}</span>`;

            }

        });

    </script>

</body>



</html>
