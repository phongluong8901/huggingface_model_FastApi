<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Domain-Specific Chatbot</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        @keyframes pulse-slow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .typing-dot {
            animation: pulse-slow 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-100 via-indigo-50 to-pink-50 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Card -->
    <div
        class="w-full max-w-3xl glass-panel shadow-2xl rounded-2xl flex flex-col h-[85vh] overflow-hidden border border-white/60">

        <!-- Header -->
        <div
            class="bg-gradient-to-r from-indigo-600 to-pink-600 px-6 py-4 flex items-center justify-between text-white shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md">
                    <i class="fa-solid fa-robot text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">AI Domain Assistant</h1>
                    <p class="text-xs text-indigo-100 flex items-center gap-1.5 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                        Trực tuyến (Mô hình T5 Fine-tuned)
                    </p>
                </div>
            </div>
            <button onclick="clearChat()"
                class="text-indigo-100 hover:text-white text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition border border-white/10">
                <i class="fa-solid fa-trash-can mr-1"></i> Xóa hội thoại
            </button>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-4 chat-container">
            <!-- Welcome message from Bot -->
            <div class="flex items-start space-x-3">
                <div
                    class="w-8 h-8 rounded-full bg-pink-600 text-white flex items-center justify-center shrink-0 shadow">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div
                    class="bg-white text-slate-800 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm max-w-[80%] border border-slate-100 text-sm leading-relaxed">
                    Xin chào! Tôi là trợ lý ảo được huấn luyện chuyên sâu theo miền dữ liệu của bạn. Tôi có thể giúp gì
                    cho bạn hôm nay?
                </div>
            </div>
        </div>

        <!-- Typing Indicator (Hidden by default) -->
        <div id="typing-indicator" class="hidden px-6 pb-2">
            <div class="flex items-start space-x-3">
                <div
                    class="w-8 h-8 rounded-full bg-pink-600 text-white flex items-center justify-center shrink-0 shadow">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div
                    class="bg-white text-slate-400 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-slate-100 flex items-center space-x-1.5">
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white/70 backdrop-blur-md border-t border-slate-200/60">
            <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center gap-3">
                <input type="text" id="user-input" placeholder="Nhập câu hỏi của bạn tại đây..." autocomplete="off"
                    class="flex-1 bg-slate-100 border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl px-4 py-3 text-sm outline-none transition">
                <button type="submit"
                    class="bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-700 hover:to-pink-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition shadow-md hover:shadow-lg flex items-center gap-2 shrink-0">
                    <span>Gửi</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>

    </div>

    <!-- Script xử lý tương tác -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Thêm tin nhắn của User vào khung chat
            appendMessage(message, 'user');
            userInput.value = '';
            scrollToBottom();

            // Hiện hiệu ứng đang gõ
            typingIndicator.classList.remove('hidden');
            scrollToBottom();

            try {
                // Gửi request đến Flask backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                // Ẩn hiệu ứng đang gõ
                typingIndicator.classList.add('hidden');

                // Thêm câu trả lời của Bot vào khung chat
                appendMessage(data.response, 'bot');
            } catch (error) {
                typingIndicator.classList.add('hidden');
                appendMessage("Đã xảy ra lỗi kết nối đến máy chủ!", 'bot');
            }
            scrollToBottom();
        }

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatarBg = isUser ? 'bg-indigo-600' : 'bg-pink-600';
            const iconClass = isUser ? 'fa-user' : 'fa-robot';
            const bubbleBg = isUser ? 'bg-indigo-600 text-white rounded-tr-sm' : 'bg-white text-slate-800 rounded-tl-sm border border-slate-100 shadow-sm';

            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full ${avatarBg} text-white flex items-center justify-center shrink-0 shadow">
                    <i class="fa-solid ${iconClass} text-sm"></i>
                </div>
                <div class="${bubbleBg} px-4 py-3 rounded-2xl max-w-[80%] text-sm leading-relaxed">
                    ${escapeHtml(text)}
                </div>
            `;
            chatContainer.appendChild(messageDiv);
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-pink-600 text-white flex items-center justify-center shrink-0 shadow">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div class="bg-white text-slate-800 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm max-w-[80%] border border-slate-100 text-sm leading-relaxed">
                        Đã làm mới cuộc hội thoại. Tôi có thể giúp gì cho bạn?
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function (m) { return map[m]; });
        }
    </script>
</body>

</html>
